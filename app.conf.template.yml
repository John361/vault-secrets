# Connection information:
# - You can connect using username / password or with token
# - By default, username / password is used unless you specify only token
#
# Mount information:
# - On import command, if the mount paths do not exist, make sure you have enough permissions to create them
#
# Request interval information:
# - Time between each request (for example when importing or exporting massive mounts paths)
# - Used to avoid rate limiting issues
vault:
  address: "http://127.0.0.1:8200"
  username: "vault-secrets"
  password: "changeme"
  token: "changeme"
  request_interval_ms: 200

find:
  mount: "vault-secrets-dev"

export:
  mounts:
    - "vault-secrets-dev"

import:
  mounts:
    - "vault-secrets-tests"
