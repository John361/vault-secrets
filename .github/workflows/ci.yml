name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      # Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "stable"
          components: clippy, rustfmt

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo test
        run: cargo test --release --all-targets --all-features --verbose

      # Terraform
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@2cffc4b4c60ac87a35cdaa3c6e07485503492827
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Run TFLint
        run: |
          tflint --config=$(pwd)/ops/terraform/libs/.tflint.hcl --init
          tflint --config=$(pwd)/ops/terraform/libs/.tflint.hcl --recursive --format=compact --chdir=ops/terraform/libs --minimum-failure-severity=notice --no-color

      # Terragrunt
      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077
        with:
          tg_version: "1.1.3"
          tofu_version: "1.12.6"

      - name: Run Terragrunt
        run: |
          cd ops/terraform/modules
          terragrunt hcl fmt --check
