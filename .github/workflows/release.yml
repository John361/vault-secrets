name: Release

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "The version to deploy"
        required: true

jobs:
  debian:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "stable"

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb package
        run: cargo deb

      - name: Upload Release Asset
        uses: softprops/action-gh-release@e5ee6bc58a36b838b92fc1217f2e4b414b5abcc8
        with:
          files: target/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup APT repository directory
        run: |
          mkdir -p public/conf
          cat << 'EOF' > public/conf/distributions
          Origin: Vault Secrets GitHub Pages
          Label: Vault Secrets APT repository
          Codename: stable
          Architectures: amd64 source
          Components: main
          Description: Vault Secrets APT repository
          SignWith: yes
          EOF

      - name: Import GPG key and generate APT Repo
        run: |
          sudo apt update && sudo apt install -y reprepro gnupg
          echo "${PRIVATE_GPG_KEY}" | gpg --import --batch
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep "^sec" | cut -d: -f5)
          echo "Using GPG Key ID: ${GPG_KEY_ID}"
          sed -i "s/SignWith: yes/SignWith: ${GPG_KEY_ID}/" public/conf/distributions
          reprepro -b public -S utils includedeb stable target/debian/*.deb
          cp vault-secrets.gpg public/
        env:
          PRIVATE_GPG_KEY: ${{ secrets.PRIVATE_GPG_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@5e98f10ce206463e411e82ac66ef0f2df79c5499

  cargo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@f14f407dad32919804d8e0550a5e471a82249cee

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  binary:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Release
        uses: taiki-e/create-gh-release-action@d95ab4c4dc917cfa4a7cfc6468a0e5267ede79ac
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        uses: taiki-e/upload-rust-binary-action@14950759bde99e9dbc62b33fff358f17d1542832
        with:
          bin: vault-secrets
          token: ${{ secrets.GITHUB_TOKEN }}
          leading-dir: true
          target: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
