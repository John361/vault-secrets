name: Release

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "The version to deploy"
        required: true

permissions:
  contents: write
  id-token: write
  actions: write
  pages: write

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb package
        run: cargo deb

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup APT repository directory
        run: |
          mkdir -p public/conf
          cat << 'EOF' > public/conf/distributions
          Origin: Vault Secrets GitHub Pages
          Label: Vault Secrets APT repository
          Codename: stable
          Architectures: amd64 source
          Components: main
          Description: Vault Secrets APT repository
          SignWith: yes
          EOF

      - name: Import GPG key and generate APT Repo
        run: |
          sudo apt update && sudo apt install -y reprepro gnupg
          echo "${{ secrets.PRIVATE_GPG_KEY }}" | gpg --import --batch
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep "^sec" | cut -d: -f5)
          echo "Using GPG Key ID: ${GPG_KEY_ID}"
          sed -i "s/SignWith: yes/SignWith: ${GPG_KEY_ID}/" public/conf/distributions
          reprepro -b public includedeb stable target/debian/*.deb

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
