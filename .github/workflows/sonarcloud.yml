name: SonarCloud analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@19b4d1e990bec64818914c40230bde93a0de300b
        with:
          enable-cache: true
          cache-dependency-glob: "ops/scripts/python/uv.lock"
          working-directory: "ops/scripts/python"

      - name: Install python dependencies
        run: |
          uv sync --project ops/scripts/python --frozen --no-build

      - name: Run Python tests and generate coverage
        run: |
          cd ops/scripts/python
          uv run --frozen --no-build pytest --cov=vault_init_credentials --cov-report=term-missing --cov-report=xml

      - name: Install Rust toolchain & Clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          components: clippy
          toolchain: "stable"

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
