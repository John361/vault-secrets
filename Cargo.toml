[package]
name = "vault-secrets"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vault-secrets"
path = "src/bin/main.rs"

[lib]
name = "lib_vault_secrets"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = {  version = "4.6.6", features = ["derive", "env"] }
config = { version = "0.15.25", features = ["yaml"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
serde = { version = "1.0.229", features = ["std", "derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vaultrs = "0.8.0"
vaultrs-login = "0.2.4"
zeroize = { version = "1.9.0", features = ["serde"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
