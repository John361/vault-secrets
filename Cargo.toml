[package]
name = "vault-secrets"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vault-secrets"
path = "src/bin/main.rs"

[lib]
name = "lib_vault_secrets"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = {  version = "4.6.6", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
