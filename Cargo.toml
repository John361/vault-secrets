[package]
name         = "vault-secrets"
description  = "A secure, lightweight Rust CLI application designed to fetch secrets from Hashicorp Vault and output them in base64 format."
authors      = ["John H"]
repository   = "https://github.com/John361/vault-secrets"
readme       = "README.md"
license-file = "LICENSE"
version      = "0.2.0"
edition      = "2024"
categories   = ["command-line-utilities", "security"]

[[bin]]
name = "vault-secrets"
path = "src/bin/main.rs"

[lib]
name = "lib_vault_secrets"
path = "src/lib/lib.rs"

[dependencies]
anyhow             = "1.0.104"
base64             = "0.23.1"
clap               = { version = "4.6.6", features = ["derive", "env"] }
config             = { version = "0.15.25", features = ["yaml"] }
tokio              = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
serde              = { version = "1.0.229", features = ["std", "derive"] }
serde_json         = "1.0.151"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vaultrs            = "0.8.0"
vaultrs-login      = "0.2.4"
yaml_serde         = "0.10.7"
zeroize            = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto       = true
opt-level = "z"
strip     = true

[package.metadata.deb]
priority = "optional"
revision = ""
assets   = [
    {
        source = "target/release/vault-secrets",
        dest   = "/usr/sbin/vault-secrets",
        mode   = "700"
    },
    {
        source = "app.conf.template.yml",
        dest   = "/etc/vault-secrets/app.conf.yml",
        mode   = "400"
    }
]
